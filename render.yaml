services:
  - type: web
    name: night-city
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NIGHT_CITY_REQUIRE_REMOTE_SAVE
        value: "true"
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
